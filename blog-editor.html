<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog Editor | Md Asif Rahman</title><link rel="stylesheet" href="blog-editor.css"></head><body><div class="editor-shell"><header class="editor-topbar"><div><span class="eyebrow">CONTENT STUDIO</span><h1>Blog Editor</h1></div><div class="top-actions"><button id="backBtn" class="ghost">← Back</button><button id="previewBtn" class="ghost">Preview</button><button id="saveBtn" class="primary">Save draft</button></div></header><main class="workspace"><section class="canvas-column"><div class="card intro-card"><input id="title" class="main-title" placeholder="Write your article title..." maxlength="180"><textarea id="description" class="lead-input" placeholder="Short description / excerpt..."></textarea><div class="meta-row"><input id="category" placeholder="Category"><input id="slug" placeholder="URL slug"><label class="switch"><input id="published" type="checkbox"><span></span> Published</label></div></div><div id="blocks" class="blocks"></div><div class="add-block"><button data-type="h1">+ H1</button><button data-type="h2">+ H2</button><button data-type="h3">+ H3</button><button data-type="h4">+ H4</button><button data-type="h5">+ H5</button><button data-type="h6">+ H6</button><button data-type="paragraph">+ Paragraph</button><button data-type="image">+ Image</button><button data-type="imageText">+ Image + Text</button><button data-type="quote">+ Quote</button><button data-type="list">+ List</button><button data-type="divider">+ Divider</button></div></section><aside class="sidebar"><div class="card"><div class="card-title"><span>SEO</span><small>SEARCH OPTIMIZATION</small></div><label>Meta title<input id="metaTitle" maxlength="60" placeholder="Ideal: 50–60 characters"></label><div class="counter" id="metaTitleCount">0 / 60</div><label>Meta description<textarea id="metaDescription" maxlength="160" rows="4" placeholder="Ideal: 140–160 characters"></textarea></label><div class="counter" id="metaDescriptionCount">0 / 160</div><label>Focus keyword<input id="focusKeyword" placeholder="Primary search phrase"></label><label>Canonical URL<input id="canonicalUrl" placeholder="https://mdasifrahman.com/blog/... "></label></div><div class="card"><div class="card-title"><span>FEATURED IMAGE</span><small>SUPABASE STORAGE</small></div><div id="coverDrop" class="upload-drop"><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden><div class="upload-icon">↑</div><strong>Drag & drop image here</strong><span>or click to browse · JPG, PNG, WEBP, GIF, AVIF · max 5MB</span></div><label>Image URL<input id="coverImage" placeholder="Automatically filled after upload"></label><label>Alt text<input id="imageAlt" placeholder="Describe the image naturally"></label><label>Social / OG image URL<input id="ogImage" placeholder="Optional — defaults to featured image"></label><div id="imagePreview" class="image-preview">No image selected</div></div><div class="card"><div class="card-title"><span>ARTICLE CHECK</span><small>QUALITY</small></div><ul id="checks" class="checks"></ul></div></aside></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="blog-editor.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const drop=document.getElementById('coverDrop'),file=document.getElementById('coverFile'),url=document.getElementById('coverImage'),alt=document.getElementById('imageAlt'),preview=document.getElementById('imagePreview');const previewImage=()=>{const u=url.value.trim();preview.innerHTML=u?'<img src="'+u.replace(/"/g,'&quot;')+'" alt="'+alt.value.replace(/"/g,'&quot;')+'">':'No image selected'};const upload=async f=>{if(!f)return;if(!f.type.startsWith('image/'))return alert('Please choose an image file.');if(f.size>5*1024*1024)return alert('Maximum image size is 5MB.');drop.classList.add('uploading');drop.querySelector('strong').textContent='Uploading...';try{const{data:{session}}=await db.auth.getSession();if(!session)throw new Error('Your admin session expired. Please sign in again.');const safe=f.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');const path='featured/'+new Date().toISOString().slice(0,10)+'/'+crypto.randomUUID()+'-'+safe;const{data,error}=await db.storage.from('blog-images').upload(path,f,{cacheControl:'31536000',contentType:f.type,upsert:false});if(error)throw error;const{data:publicData}=db.storage.from('blog-images').getPublicUrl(data.path);url.value=publicData.publicUrl;previewImage();if(typeof updateSEO==='function')updateSEO();drop.querySelector('strong').textContent='Upload complete';setTimeout(()=>drop.querySelector('strong').textContent='Drag & drop image here',1400)}catch(e){console.error(e);alert('Image upload failed: '+e.message);drop.querySelector('strong').textContent='Drag & drop image here'}finally{drop.classList.remove('uploading')}};file.addEventListener('change',e=>upload(e.target.files[0]));drop.addEventListener('click',()=>file.click());['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('dragover')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('dragover')}));drop.addEventListener('drop',e=>upload(e.dataTransfer.files[0]));url.addEventListener('input',previewImage);alt.addEventListener('input',previewImage);previewImage()});</script></body></html>
